{% extends "base.html" %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<h2>Создать аккаунт</h2>

{% if form.errors %}
  <p style="color: #b91c1c; text-align: center;">Исправьте ошибки ниже.</p>
{% endif %}

<form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Создать аккаунт</button>
</form>

<a href="{% url 'login' %}" class="secondary-button">Уже есть аккаунт? Войти</a>
{% endblock %}
