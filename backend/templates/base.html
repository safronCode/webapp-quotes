<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Django Auth Tutorial{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            background: #f7f9fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        main {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #222;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            border-color: #4f46e5;
            outline: none;
        }
        button,
        .secondary-button {
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
        }
        button:hover {
            background: #4338ca;
        }
        .secondary-button {
            background: #e0e7ff;
            color: #3730a3;
            border: none;
            margin-top: 0.5rem;
        }
        .secondary-button:hover {
            background: #c7d2fe;
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>

<body>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>
