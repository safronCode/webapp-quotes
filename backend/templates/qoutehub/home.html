{% load static %}

<!DOCTYPE html>
<html lang="">
<head>
    <title>Main</title>
    <style>
        @font-face {
            font-family: 'EpilepsySans';
            src: url('{%static 'fonts/EpilepsySans.ttf'%}') format('truetype');
        }

    body.morning {
        background-image: url('{% static 'bg_morning.png' %}');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;

        font-family: 'EpilepsySans', sans-serif;
        color: #16162e;
        text-shadow: 4px 4px 10px rgb(0, 0, 0);
    }
    body.day {
        background-image: url('{% static 'bg_day.png' %}');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;

        font-family: 'EpilepsySans', sans-serif;
        color: #103ddc;
        text-shadow: 4px 4px 10px rgb(11, 36, 122);
    }
    body.evening {
        background-image: url('{% static 'bg_evening.png' %}');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;

        font-family: 'EpilepsySans', sans-serif;
        color: #FFD700;
        text-shadow: 4px 4px 10px rgba(255, 215, 0, 0.8);
    }

    body.night {
        background-image: url('{% static 'bg_night.png' %}');
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;

        font-family: 'EpilepsySans', sans-serif;
        --main-color: #6712ed;
        --main-text-shadow: 4px 4px 10px rgba(88, 12, 225, 0.8);
        color: var(--main-color);
        text-shadow: var(--main-text-shadow);
    }


    .quote-container {
        position: absolute;
        top: 25%;
        left: 40%;
        max-width: 800px;
    }

    .wishes-text {
        font-size: 60px;
    }

    .quote-text {
        margin-top: 15px;
        font-size: 30px;
    }

    body.morning .quote-text{
         color: #06154a;
         text-shadow: 4px 4px 10px rgb(0, 0, 0);
    }

     body.day .quote-text{
         color: #092688;
         text-shadow: 4px 4px 10px rgb(4, 17, 57);
     }

     body.evening .quote-text{
         color: rgba(168, 142, 0, 0.86);
         text-shadow: 4px 4px 10px rgba(255, 215, 0, 0.8);
     }

     body.night .quote-text{
         color: rgba(100, 0, 168, 0.86);
         text-shadow: 4px 4px 10px rgba(134, 7, 209, 0.8);
     }

     .source-text {
         margin-top: 15px;
         text-align: right;
         font-size: 25px;
         color: var(--main-color);
         text-shadow: var(--main-text-shadow);
     }
     
     .stats-container {
            position: fixed;
            top: 70%;
            left: 40%;
            margin-top: 100px;
     }
     
     .storage-bridge a{
         margin-right: 50px;
         font-size: 30px;
         text-align: right;
         color: rgba(255, 255, 255, 0.86);
         text-shadow: 4px 4px 10px rgba(211, 165, 239, 0.8);
     }
     
     
     .stats-container a {
         margin-left: 5px;
         margin-right: 50px;
         font-size: 30px;
         text-align: right;
         color: rgba(255, 255, 255, 0.86);
         text-shadow: 4px 4px 10px rgba(211, 165, 239, 0.8);
     }

    .stats-container .icon {
      width: 32px;
      height: 32px;
      fill: rgba(255, 255, 255, 0.86);
      cursor: pointer;
    }


    </style>
</head>

<body class ="{{ current_theme }}">
    <div style="text-align: center;
                font-size: 150px;
                color: rgba(255, 255, 255, 0.86);
                text-shadow: 4px 4px 10px rgba(211, 165, 239, 0.8);">
        QouteHub
    </div>    

    <div class="quote-container">
        <div class="wishes-text"> {{wish_text}}, интернет-путник! </div>
        <div class="quote-text"> {{quote_text}} </div>    
        <div class="source-text"> ~ {{source}} </div>
    </div>
    
    <div class="stats-container">
        <img src="{% static 'likeheart_filled.svg' %}" class="icon" alt="Like">
        <a href="{% url 'storage-page' %}"> {{ likes }} like</a>
        <img src="{% static 'dislikeheart_filled.svg' %}" class="icon" alt="Like">
        <a href="{% url 'storage-page' %}"> {{ dislikes }} dislike</a>
        <img src="{% static 'ender-eye.svg' %}" class="icon" alt="Like">
        <a> {{ views }} views</a>
        
        <a href="{% url 'storage-page' %}">Смотреть больше цитат ...</a>
    </div>
    
   
</body>
</html>
